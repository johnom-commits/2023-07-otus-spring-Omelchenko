<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
    <style type="text/css">
        body {
            padding: 50px;
        }
        .books {
            border: 2px solid steelblue;
            width: 700px;
            border-collapse: collapse;
        }
        .books tr td, th {
            padding: 5px;
            border: 2px solid steelblue;
        }
        .books td:last-child, td:first-child {
            width: 100px;
        }
    }
    </style>
</head>
<body>
<h1>Книги</h1>
<div style="padding-bottom: 20px;">
    <table class="books">
        <thead>
        <tr>
            <th>Id</th>
            <th>Название</th>
            <th>Автор</th>
            <th>Жанр</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.authorDto.name}"></td>
            <td th:text="${book.genreDto.name}"></td>
        </tr>
        </tbody>
    </table>
</div>

<a th:href="@{/new_book}" class="btn"  style="font-size: 20px;">Добавить новую книгу</a>
</body>
</html>
